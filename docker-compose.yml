services:
  klangk:
    image: ghcr.io/mcdonc/klangk/klangk-host-custom
    ports:
      - "8995:8995"
    devices:
      - /dev/net/tun
      - /dev/fuse
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - label=disable
      - systempaths=unconfined
    cap_add:
      - SYS_ADMIN
    environment:
      KLANGK_NGINX_PORT: "${KLANGK_NGINX_PORT:-8995}"
      KLANGK_DEFAULT_USER: "${KLANGK_DEFAULT_USER:-admin@enfoldsystems.net}"
      KLANGK_DEFAULT_PASSWORD: "${KLANGK_DEFAULT_PASSWORD}"
      KLANGK_PORT: "${KLANGK_PORT:-8997}"
      KLANGK_LLM_BASE_URL: "${KLANGK_LLM_BASE_URL}"
      KLANGK_LLM_API_KEY: "${KLANGK_LLM_API_KEY}"
      KLANGK_LLM_MODEL: "${KLANGK_LLM_MODEL}"
      KLANGK_DATA_DIR: /home/klangk/data
      KLANGK_JWT_SECRET: "${KLANGK_JWT_SECRET}"
      LOGFIRE_BASE_URL: "${LOGFIRE_BASE_URL}"
      LOGFIRE_TOKEN: "${LOGFIRE_TOKEN}"
      LOGFIRE_ENVIRONMENT: "${LOGFIRE_ENVIRONMENT}"
      SOLIPLEX_URL: "${SOLIPLEX_URL:-https://rag.enfoldsystems.net}"
      KLANGK_OIDC_CONFIG: "${KLANGK_OIDC_CONFIG:-/home/klangk/oidc.yaml}"
      KLANGK_AUTH_MODES: "both"
      KLANGK_DISABLE_REGISTRATION: "1"
      KLANGK_DNS_SERVERS: "${KLANGK_DNS_SERVERS:-100.100.100.100,8.8.8.8}"
      KLANGK_ALLOWED_MOUNT_ROOTS: "${KLANGK_ALLOWED_MOUNT_ROOTS:-/var/lib/klangk/mount}"
      KLANGK_SMTP_HOST: "${KLANGK_SMTP_HOST}"
      KLANGK_SMTP_USER: "${KLANGK_SMTP_USER}"
      KLANGK_SMTP_PASSWORD: "${KLANGK_SMTP_PASSWORD}"
      KLANGK_SMTP_FROM: "${KLANGK_SMTP_FROM}"
      KLANGK_INSTANCE_ID: "${KLANGK_INSTANCE_ID:-default}"
      KLANGK_PREVENT_INSECURE_JWT_SECRET: "1"
      # Point Python TLS at the OS trust store, which includes the Enfold/RAG demo CA
      # baked in via /usr/local/share/ca-certificates/. Without these, requests/urllib3
      # fall back to certifi, which does not include the private CA fronting Logfire.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./oidc.yaml:/home/klangk/oidc.yaml:ro
      - ./cacert.pem:/home/klangk/cacert.pem:ro
      # ensure data and mount volumes are created ahead of time.  must be owned by 1000:1000
      - type: bind
        source: ./data
        target: /home/klangk/data
        bind:
          create_host_path: false
      - type: bind
        source: ./mount
        target: /home/klangk/mount
        bind:
          create_host_path: false


